version: '3.8'

services:
  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    container_name: longchain-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: longchain_rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: longchain-backend
    environment:
      # 数据库配置
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres123}@db:5432/longchain_rag

      # API Keys
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}

      # JWT 密钥
      SECRET_KEY: ${SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 43200

      # 文件上传配置
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE: 10485760

      # 向量数据库配置
      CHROMA_PERSIST_DIR: /app/chroma_db
      CHROMA_COLLECTION_NAME: longchain_rag

      # AI 模型配置
      MODEL_NAME: qwen-plus
      EMBEDDING_MODEL: text-embedding-v3
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/chroma_db:/app/chroma_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: longchain-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: longchain-network
